# @package _global_
defaults:
  - override /dataset: qm9

general:
  name: 'qm9_no_constraint_edge_addition'

model:
  transition: edge_insertion
  rev_proj: null
  diffusion_steps: 500
  n_layers: 4
  hidden_mlp_dims: { X: 128, E: 128, y: 128 }
  hidden_dims:
    dx: 128
    de: 128
    dy: 128
    n_head: 4
    dim_ffX: 256
    dim_ffE: 256
    dim_ffy: 256

train:
  early_stopping:
    divergence_threshold: 300.0    # Stop if NLL exceeds 300.0 (appropriate for QM9 dataset)